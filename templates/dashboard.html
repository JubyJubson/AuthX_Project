<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>AuthX - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">AuthX Portal</a>
        <div class="d-flex">
            <span class="navbar-text me-3">Logat ca: <b>{{ user.email }}</b></span>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <!-- Partea de adaugare tichet -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">Adaugă Tichet Nou</div>
                <div class="card-body">
                    <form method="POST" action="/ticket/add">
                        <div class="mb-2">
                            <label>Titlu</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label>Descriere</label>
                            <textarea name="description" class="form-control" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Creează</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Partea de vizualizare / search tichete -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                    <span>Tichetele Mele</span>
                    <form method="GET" action="/search" class="d-flex">
                        <input type="text" name="q" class="form-control form-control-sm me-2" placeholder="Caută..." value="{{ search_query }}">
                        <button class="btn btn-light btn-sm" type="submit">Caută</button>
                    </form>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Titlu</th>
                                <th>Descriere</th>
                                <th>Acțiune</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for ticket in tickets %}
                            <tr>
                                <td>#{{ ticket.id }}</td>
                                <td>{{ ticket.title }}</td>
                                <td>{{ ticket.description }}</td>
                                <td>
                                    <!-- Butonul de delete care ar putea suferi de IDOR in V1 -->
                                    <form method="POST" action="/ticket/delete/{{ ticket.id }}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Șterge</button>
                                    </form>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center">Nu există tichete.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
