<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>AuthX - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center">
                    <h4>Autentificare AuthX</h4>
                </div>
                <div class="card-body">
                    <!-- AICI SE VEDE VULNERABILITATEA DE USER ENUMERATION -->
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="POST" action="/login">
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Parolă</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Intră în cont</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="/register">Nu ai cont? Creează unul.</a>
                        <a href="/forgot_password" class="text-danger">Ai uitat parola?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
