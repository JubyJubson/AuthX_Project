<!--
O pagina foarte simpla cu un singur camp pentru adresa de email unde vrei sa primesti token-ul de reset.
Dupa ce apesi butonul, in loc sa trimit pe bune email (ca e greu sa setez un server SMTP),
afisez link-ul simulat direct pe pagina.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AuthX - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-danger text-white text-center">
                    <h4>Password Recovery</h4>
                </div>
                <div class="card-body">
                    {% if msg %}
                        <div class="alert alert-info">{{ msg }}</div>
                    {% endif %}
                    <form method="POST" action="/forgot_password">
                        <div class="mb-3">
                            <label>Enter your Email Address:</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Send Reset Link</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="/login">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
